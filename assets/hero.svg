<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#09151B" />
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#34D399" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55" />
    </pattern>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .pet-float { animation: petBounce 2.2s ease-in-out infinite; transform-origin: 930px 210px; }
      .eye-blink { animation: blink 3.8s infinite; transform-origin: center; }
      .bubble-float { animation: bubblePop 3.2s ease-in-out infinite; }
      .scanline { animation: sweep 5s linear infinite; }
      .star-spin { animation: twinkle 2.4s ease-in-out infinite; }
      .star-spin2 { animation: twinkle 2.4s ease-in-out 1.2s infinite; }
      .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes petBounce {
        0%, 100% { transform: translateY(0px) rotate(-1deg); }
        50% { transform: translateY(-14px) rotate(2deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes bubblePop {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes sweep {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(420px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  
  <rect width="1200" height="360" rx="20" fill="url(#bg)" />
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />
  <rect width="1200" height="360" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="360" rx="20" fill="url(#glow2)" />
  <rect class="scanline" x="0" y="0" width="1200" height="70" fill="url(#scan)" />
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#1E293B" stroke-width="2" />

  
  <g transform="translate(64, 48)">
    <rect width="265" height="32" rx="16" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2" />
    <circle class="pulse-dot" cx="18" cy="16" r="5" fill="#10B981" filter="url(#neon)" />
    <text x="34" y="21" fill="#A7F3D0" font-family="Consolas, &#39;JetBrains Mono&#39;, monospace" font-size="13" font-weight="700">365 CHALLENGE // DAY 11</text>
  </g>

  
  <text x="64" y="156" fill="url(#titleGrad)" font-family="&#39;Segoe UI&#39;, -apple-system, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">MINIME PET</text>
  <text x="66" y="198" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, -apple-system, sans-serif" font-size="21" font-weight="500">Your chaotic miniature self living always-on-top over Windows.</text>
  <text x="66" y="228" fill="#64748B" font-family="Consolas, monospace" font-size="14">AI 4x2 Sprite Setup  •  Chroma Key #00FF00  •  Win32 Window Chaos  •  ~35MB RAM</text>

  
  <g transform="translate(64, 266)" font-family="Consolas, monospace" font-size="13" font-weight="700">
    <rect x="0" y="0" width="126" height="34" rx="8" fill="#111827" stroke="#334155" />
    <text x="16" y="22" fill="#38BDF8">C# .NET 8</text>
    <rect x="138" y="0" width="126" height="34" rx="8" fill="#111827" stroke="#334155" />
    <text x="156" y="22" fill="#34D399">Win32 API</text>
    <rect x="276" y="0" width="154" height="34" rx="8" fill="#111827" stroke="#334155" />
    <text x="292" y="22" fill="#FBBF24">60FPS Physics</text>
    <rect x="442" y="0" width="152" height="34" rx="8" fill="#111827" stroke="#334155" />
    <text x="458" y="22" fill="#F472B6">Gemini / Groq</text>
  </g>

  
  <g>
    
    <g class="bubble-float" transform="translate(770, 42)">
      <rect width="350" height="54" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.8" />
      <polygon points="150,54 166,54 156,68" fill="#111827" stroke="#10B981" stroke-width="1.5" />
      <text x="175" y="33" text-anchor="middle" fill="#F8FAFC" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="16" font-weight="700">يا عم قوم اشرب مية، الباج مش هيطير! ☕</text>
    </g>

    
    <ellipse cx="945" cy="306" rx="68" ry="12" fill="#000000" opacity="0.55" />

    
    <g class="pet-float">
      
      <rect x="902" y="216" width="86" height="66" rx="22" fill="#10B981" />
      <rect x="920" y="232" width="50" height="32" rx="10" fill="#059669" />
      
      <rect x="880" y="226" width="24" height="44" rx="12" fill="#10B981" transform="rotate(18 892 248)" />
      <rect x="986" y="220" width="24" height="44" rx="12" fill="#10B981" transform="rotate(-28 998 242)" />
      
      <rect x="916" y="274" width="20" height="24" rx="8" fill="#1E293B" />
      <rect x="954" y="274" width="20" height="24" rx="8" fill="#1E293B" />
      
      <rect x="885" y="122" width="120" height="104" rx="44" fill="#FDE68A" stroke="#0F172A" stroke-width="4" />
      
      <path d="M882 162 C882 110, 1008 110, 1008 162 C992 142, 968 148, 945 140 C920 148, 898 142, 882 162 Z" fill="#0F172A" />
      
      <g class="eye-blink">
        <ellipse cx="924" cy="176" rx="9" ry="12" fill="#0F172A" />
        <circle cx="927" cy="172" r="3.5" fill="#FFFFFF" />
        <ellipse cx="966" cy="176" rx="9" ry="12" fill="#0F172A" />
        <circle cx="969" cy="172" r="3.5" fill="#FFFFFF" />
      </g>
      
      <ellipse cx="906" cy="190" rx="8" ry="4" fill="#FB7185" opacity="0.45" />
      <ellipse cx="984" cy="190" rx="8" ry="4" fill="#FB7185" opacity="0.45" />
      <path d="M936 196 Q948 206 960 194" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
      
      <path d="M882 168 C882 108, 1008 108, 1008 168" fill="none" stroke="#38BDF8" stroke-width="6" />
      <rect x="872" y="156" width="16" height="34" rx="8" fill="#38BDF8" />
      <rect x="1002" y="156" width="16" height="34" rx="8" fill="#38BDF8" />
    </g>

    
    <text class="star-spin" x="835" y="155" fill="#FBBF24" font-size="22">✦</text>
    <text class="star-spin2" x="1045" y="175" fill="#38BDF8" font-size="18">✦</text>
  </g>
</svg>