<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0D1726" />
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <style>
      .laser-bar { animation: scanX 3.4s ease-in-out infinite; }
      @keyframes scanX {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(250px); }
      }
    </style>
  </defs>

  <rect width="1200" height="220" rx="16" fill="url(#cbg)" stroke="#1E293B" stroke-width="2" />

  
  <g transform="translate(42, 34)">
    <text x="0" y="14" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700">1. AI 4x2 GREEN SCREEN (#00FF00)</text>
    <rect x="0" y="26" width="260" height="126" rx="10" fill="#00D94A" stroke="#10B981" stroke-width="2" />
    <line x1="65" y1="26" x2="65" y2="152" stroke="#065F46" stroke-dasharray="4 3" />
    <line x1="130" y1="26" x2="130" y2="152" stroke="#065F46" stroke-dasharray="4 3" />
    <line x1="195" y1="26" x2="195" y2="152" stroke="#065F46" stroke-dasharray="4 3" />
    <line x1="0" y1="89" x2="260" y2="89" stroke="#065F46" stroke-dasharray="4 3" />
    
    <circle cx="32" cy="58" r="14" fill="#0F172A" /><circle cx="97" cy="58" r="14" fill="#0F172A" />
    <circle cx="162" cy="58" r="14" fill="#0F172A" /><circle cx="227" cy="58" r="14" fill="#0F172A" />
    <circle cx="32" cy="120" r="14" fill="#0F172A" /><circle cx="97" cy="120" r="14" fill="#0F172A" />
    <circle cx="162" cy="120" r="14" fill="#0F172A" /><circle cx="227" cy="120" r="14" fill="#0F172A" />
    
    <rect class="laser-bar" x="0" y="24" width="12" height="130" fill="url(#laser)" />
  </g>

  
  <text x="338" y="128" fill="#38BDF8" font-family="Consolas, monospace" font-size="28" font-weight="700">➜</text>

  
  <g transform="translate(396, 48)">
    <rect width="265" height="126" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.6" />
    <text x="132" y="34" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">2. CHROMA KEY ENGINE</text>
    <text x="132" y="64" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">• Strips #00FF00 Green</text>
    <text x="132" y="86" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">• Edge Spill Suppression</text>
    <text x="132" y="108" text-anchor="middle" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">• 4x2 Auto-Slicer (8 States)</text>
  </g>

  
  <text x="696" y="128" fill="#10B981" font-family="Consolas, monospace" font-size="28" font-weight="700">➜</text>

  
  <g transform="translate(752, 34)" font-family="Consolas, monospace" font-size="11" font-weight="700">
    <text x="0" y="14" fill="#FBBF24" font-size="12">3. 8 TRANSPARENT LIVE STATES</text>
    <rect x="0" y="26" width="96" height="56" rx="8" fill="#111827" stroke="#334155" /><text x="48" y="58" text-anchor="middle" fill="#E2E8F0">IDLE</text>
    <rect x="106" y="26" width="96" height="56" rx="8" fill="#111827" stroke="#334155" /><text x="154" y="58" text-anchor="middle" fill="#E2E8F0">WALK 1</text>
    <rect x="212" y="26" width="96" height="56" rx="8" fill="#111827" stroke="#334155" /><text x="260" y="58" text-anchor="middle" fill="#E2E8F0">WALK 2</text>
    <rect x="318" y="26" width="96" height="56" rx="8" fill="#111827" stroke="#FBBF24" /><text x="366" y="58" text-anchor="middle" fill="#FBBF24">TROLL</text>

    <rect x="0" y="94" width="96" height="56" rx="8" fill="#111827" stroke="#EF4444" /><text x="48" y="126" text-anchor="middle" fill="#F87171">HIT</text>
    <rect x="106" y="94" width="96" height="56" rx="8" fill="#111827" stroke="#38BDF8" /><text x="154" y="126" text-anchor="middle" fill="#38BDF8">DRAGGED</text>
    <rect x="212" y="94" width="96" height="56" rx="8" fill="#111827" stroke="#10B981" /><text x="260" y="126" text-anchor="middle" fill="#34D399">SITTING</text>
    <rect x="318" y="94" width="96" height="56" rx="8" fill="#111827" stroke="#64748B" /><text x="366" y="126" text-anchor="middle" fill="#94A3B8">SLEEP</text>
